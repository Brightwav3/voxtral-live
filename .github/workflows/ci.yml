name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The deterministic suite uses injected audio/provider seams. Native
      # PortAudio builds are hardware qualification, not a CI prerequisite.
      - run: npm ci --ignore-scripts
      - run: npm test
